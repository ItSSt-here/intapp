<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partial Fractions Integral Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Partial Fractions Integral Practice</h1>
    <p class="subtitle">Find the antiderivative using partial fractions.</p>

    <div class="card">
      <div class="label">Problem</div>
      <math-field id="problem" read-only class="display-field"></math-field>
    </div>

    <div class="card">
      <div class="label">Your answer (antiderivative — the "+ C" is optional)</div>
      <math-field id="answer" class="input-field" virtual-keyboard-mode="onfocus"></math-field>
    </div>

    <div class="buttons">
      <button id="checkBtn">Check</button>
      <button id="nextBtn" class="secondary">Next exercise</button>
    </div>

    <div id="feedback" class="feedback"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
