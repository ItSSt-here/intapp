<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מגדל האינטגרלים</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- Tower map -->
    <section id="mapView" class="view">
      <header class="map-header">
        <h1>מגדל האינטגרלים</h1>
        <p class="subtitle">כל חדר הוא כמה תרגילים קצרים. בוחרים חדר, עוברים אותו, וממשיכים הלאה.</p>
      </header>
      <div class="map-layout">
        <nav class="tower-nav" id="towerNav" aria-label="קומות"></nav>
        <div class="tower" id="tower"></div>
      </div>
    </section>

    <!-- Room -->
    <section id="roomView" class="view" hidden>
      <!-- The room is a courtyard inside the castle walls; the exercise sits
           on its clean floor. -->
      <div class="castle-wall">
      <div class="castle-court">
      <div class="room-header" id="roomHeader">
      <div class="room-bar">
        <button type="button" id="backBtn" class="nav-btn"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>למפה</span></button>
        <div class="room-name-wrap">
          <div class="room-name room-title" id="roomName"></div>
          <div class="room-name-en" id="roomEn" dir="ltr"></div>
          <div class="room-label" id="roomLabel" hidden></div>
        </div>
        <div class="score-wrap" id="scoreWrap">
          <span class="score-label">ניקוד</span>
          <span id="scoreChip" class="score-chip"></span>
          <button type="button" id="restartBtn" class="nav-btn restart-btn" title="להתחיל את החדר מההתחלה, עם ניקוד מלא (לחיצה כפולה)" hidden></button>
        </div>
      </div>

      <div class="path" id="path"></div>
      <div class="node-caption" id="nodeCaption"></div>
      </div>

      <div id="problemCardSlot">
        <div class="card problem-card" id="problemCard">
          <div class="label">חשבו את האינטגרל</div>
          <math-field id="problem" read-only class="display-field" dir="ltr"></math-field>
        </div>
      </div>

      <div class="card answer-card" id="answerCard">
        <div class="answer-badge" id="answerBadge"></div>
        <div class="answer-status-text" id="answerStatusText"></div>
        <div class="label">התשובה שלך</div>
        <div class="answer-hint">כתבו <b dir="ltr">ln</b> ללוגריתם ו-<b dir="ltr">| |</b> לערך מוחלט. סימנים נוספים בכפתור <span class="field-menu-btn" aria-hidden="true">▾</span>. ה-<bdi dir="ltr">+C</bdi> לא חובה. אפשר ללחוץ <b>Enter</b> לבדיקה.</div>
        <span class="field-wrap" id="answerFieldWrap">
          <math-field id="answer" class="input-field" dir="ltr" virtual-keyboard-mode="onfocus"></math-field>
          <button type="button" class="field-menu-btn" id="answerMenuBtn" title="סימנים נוספים" aria-label="סימנים נוספים" aria-expanded="false">▾</button>
          <div class="field-menu" id="answerMenu" dir="ltr" hidden>
            <button type="button" class="field-menu-item" data-insert="\sqrt{#0}" title="שורש">√</button>
            <button type="button" class="field-menu-item" data-insert="\sqrt[#0]{#1}" title="שורש n">ⁿ√</button>
            <button type="button" class="field-menu-item" data-insert="\frac{#0}{#1}" title="שבר">a⁄b</button>
            <button type="button" class="field-menu-item" data-insert="^{#0}" title="חזקה">x²</button>
            <button type="button" class="field-menu-item" data-insert="e^{#0}" title="e בחזקה">eˣ</button>
            <button type="button" class="field-menu-item" data-insert="\ln\left|#0\right|" title="ln">ln</button>
            <button type="button" class="field-menu-item" data-insert="\left|#0\right|" title="ערך מוחלט">|x|</button>
            <button type="button" class="field-menu-item" data-insert="\sin\left(#0\right)" title="sin">sin</button>
            <button type="button" class="field-menu-item" data-insert="\cos\left(#0\right)" title="cos">cos</button>
            <button type="button" class="field-menu-item" data-insert="\tan\left(#0\right)" title="tan">tan</button>
            <button type="button" class="field-menu-item" data-insert="\cot\left(#0\right)" title="cot">cot</button>
            <button type="button" class="field-menu-item" data-insert="\arctan\left(#0\right)" title="arctan">arctan</button>
            <button type="button" class="field-menu-item" data-insert="\arcsin\left(#0\right)" title="arcsin">arcsin</button>
          </div>
        </span>
        <div id="solutionLabel" class="label showing-solution" hidden>פתרון</div>
        <div class="solution-scroll">
          <math-field id="solution" read-only class="solution-field" dir="ltr" hidden></math-field>
        </div>
      </div>

      <div class="buttons">
        <button type="button" id="checkBtn">בדיקה</button>
        <button type="button" id="solutionBtn">הצג פתרון <bdi class="cost" dir="ltr">(−3)</bdi></button>
        <button type="button" id="nextBtn" hidden>המשך ←</button>
      </div>

      <div id="feedback" class="feedback"></div>
      </div>
      </div>
    </section>

    <!-- Room conquered -->
    <section id="conquestView" class="view" hidden>
      <div id="conquest" class="conquest"></div>
    </section>

    <!-- The medal room -->
    <section id="medalView" class="view" hidden>
      <div class="castle-wall">
      <div class="castle-court">
      <div class="room-bar">
        <button type="button" id="medalBackBtn" class="nav-btn"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>למפה</span></button>
        <div class="room-name-wrap"><div class="room-name">חדר המדליות</div></div>
        <div class="room-bar-spacer"></div>
      </div>
      <div id="medalStage" class="medal-stage"></div>
      </div>
      </div>
    </section>
  </div>

  <!-- "Open anyway" confirmation for a room that isn't next on the path -->
  <div id="lockDialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="lockDialogTitle">
      <h2 id="lockDialogTitle">לא מומלץ עדיין</h2>
      <p id="lockDialogText"></p>
      <div class="dialog-buttons">
        <button type="button" id="lockBackBtn" class="primary-btn"></button>
        <button type="button" id="lockAnywayBtn" class="secondary-btn">לפתוח בכל זאת</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
