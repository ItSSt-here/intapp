<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partial Fractions Integral Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Partial Fractions Integral Practice</h1>
    <p class="subtitle">Find the antiderivative using partial fractions.</p>

    <div id="problemCardSlot">
      <div class="card problem-card" id="problemCard">
        <div class="label">Evaluate the integral</div>
        <math-field id="problem" read-only class="display-field"></math-field>
      </div>
    </div>

    <div class="card answer-card" id="answerCard">
      <div class="answer-badge" id="answerBadge"></div>
      <div class="answer-status-text" id="answerStatusText"></div>
      <div class="label">Your answer</div>
      <div class="answer-hint">Type <b>ln</b> for the logarithm and use <b>| |</b> for absolute value. The “+ C” is optional.</div>
      <math-field id="answer" class="input-field" virtual-keyboard-mode="onfocus"></math-field>
      <div id="solutionLabel" class="label showing-solution" hidden>Solution</div>
      <math-field id="solution" read-only class="solution-field" hidden></math-field>
    </div>

    <div class="buttons">
      <button id="checkBtn">Check</button>
      <button id="solutionBtn">Show solution</button>
      <button id="nextBtn">Another exercise</button>
    </div>

    <div id="feedback" class="feedback"></div>

    <!-- TEMP: plain on purpose, to be replaced by a real type chooser -->
    <p><button id="typeBtn" type="button" style="font-size: 0.8rem; padding: 4px 8px; background: #ddd; color: #333; font-weight: normal;"></button></p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
